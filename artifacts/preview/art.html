<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>art</title>
<style>
  body { margin:0; background:#070c18; font-family:"Segoe UI",Arial,sans-serif; color:#cbd5e1; }
  .row { padding:22px 28px; border-bottom:1px solid #1e293b; }
  .label { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#64748b; margin-bottom:10px; }
  img { display:inline-block; }
  .onwhite { background:#ffffff; padding:12px; display:inline-block; }
</style></head>
<body>
  <div class="row"><div class="label">mark 320px</div><img src="/brand/mark.svg" width="320"></div>
  <div class="row"><div class="label">wordmark 520px</div><img src="/brand/wordmark.svg" width="520"></div>
  <div class="row"><div class="label">lockup</div>
    <span style="display:inline-flex;align-items:center;gap:14px;padding:10px">
      <img src="/brand/mark.svg" height="60"><img src="/brand/wordmark.svg" height="26">
    </span>
  </div>
  <div class="row"><div class="label">mark on white</div><div class="onwhite"><img src="/brand/mark.svg" height="80"></div></div>
</body></html>
