name: Apply the first-added fix

on:
  push:
    branches:
      - fix/keep-first-added

permissions:
  contents: write

concurrency:
  group: apply-first-added
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/keep-first-added
          fetch-depth: 1

      - name: Apply the patch
        run: git apply --verbose keep-first-added.patch

      - name: Commit the fix
        run: |
          git config user.name "ItemShare"
          git config user.email "bot@users.noreply.github.com"
          git add CHANGELOG.md lib/store.js
          git commit -m "Keep the date a share was first added" -m "An upload that matched an item already on the table rewrote every column of that row, the arrival date included, so an item handed out and shared again took the later date and read as new. The arrival date is now held: a blank is filled, and of two real dates the older wins. Everything else is still refreshed, and a standing offer keeps its own first date the same way."

      - name: Remove the one-off workflow and its patch
        run: |
          git rm -q keep-first-added.patch
          git rm -q .github/workflows/apply-keep-first-added.yml
          git commit -m "Remove the one-off workflow used to apply the fix"
          git push origin HEAD:fix/keep-first-added
